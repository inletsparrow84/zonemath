[project]
name = "zonemath"
version = "0.1.0"
description = "Convert a wall-clock time between IANA timezones, handling DST gaps and ambiguous times explicitly."
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zonemath*"]
